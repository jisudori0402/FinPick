<!DOCTYPE html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>FinPick - 로그인</title>
    <style>
      * { box-sizing: border-box; }
      body { margin: 0; background: #f4f7fb; font-family: Arial, sans-serif; color: #111827; }
      .wrap { max-width: 480px; margin: 0 auto; padding: 30px; }
      .card { background: white; border-radius: 24px; padding: 28px; box-shadow: 0 4px 16px rgba(0,0,0,0.08); }
      h1 { color: #2563eb; margin-bottom: 8px; }
      .msg { padding: 10px 12px; border-radius: 12px; background: #fee2e2; color: #b91c1c; margin-bottom: 12px; }
      .ok { background: #ecfdf5; color: #047857; }
      label { display: block; margin-top: 12px; font-weight: 700; }
      input { width: 100%; padding: 12px; margin-top: 6px; border-radius: 12px; border: 1px solid #d1d5db; }
      .btn { margin-top: 18px; width: 100%; padding: 14px; border: none; border-radius: 14px; background:#2563eb; color:white; cursor:pointer; font-size:16px; }
      a { color: #2563eb; text-decoration: none; }
    </style>
  </head>
  <body>
    <div class="wrap">
      <div class="card">
        <h1>FinPick 로그인</h1>
        <p>회원가입한 계정으로 로그인해 주세요.</p>

        <form method="post">
          {% csrf_token %}
          <label>아이디</label>
          <input name="username" required />
          <label>비밀번호</label>
          <input type="password" name="password" required />
          <button class="btn" type="submit">로그인</button>
        </form>
        <p style="margin-top: 12px;">아직 계정이 없나요? <a href="/signup/">회원가입</a></p>
      </div>
    </div>
  </body>
</html>
