<!DOCTYPE html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>FinPick - 회원가입</title>
    <style>
      * { box-sizing: border-box; }
      body { margin: 0; background: #f4f7fb; font-family: Arial, sans-serif; color: #111827; }
      .wrap { max-width: 760px; margin: 0 auto; padding: 30px; }
      .card { background: white; border-radius: 24px; padding: 28px; box-shadow: 0 4px 16px rgba(0,0,0,0.08); }
      h1 { color: #2563eb; margin-bottom: 8px; }
      .msg { padding: 10px 12px; border-radius: 12px; background: #fee2e2; color: #b91c1c; margin-bottom: 12px; }
      .ok { background: #ecfdf5; color: #047857; }
      label { display: block; margin-top: 12px; font-weight: 700; }
      input, select { width: 100%; padding: 12px; margin-top: 6px; border-radius: 12px; border: 1px solid #d1d5db; }
      .btn { margin-top: 18px; width: 100%; padding: 14px; border: none; border-radius: 14px; background:#2563eb; color:white; cursor:pointer; font-size:16px; }
      a { color: #2563eb; text-decoration: none; }
      .row { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
    </style>
  </head>
  <body>
    <div class="wrap">
      <div class="card">
        <h1>FinPick 회원가입</h1>
        <p>기본 정보와 금융 성향을 저장해 맞춤 추천을 시작해 보세요.</p>

        {% if messages %}
          {% for message in messages %}
            <div class="msg {% if message.tags == 'success' %}ok{% endif %}">{{ message }}</div>
          {% endfor %}
        {% endif %}

        <form method="post">
          {% csrf_token %}
          <div class="row">
            <div>
              <label>아이디</label>
              <input name="username" required />
            </div>
            <div>
              <label>이메일</label>
              <input type="email" name="email" required />
            </div>
          </div>
          <div class="row">
            <div>
              <label>비밀번호</label>
              <input type="password" name="password1" required />
            </div>
            <div>
              <label>비밀번호 확인</label>
              <input type="password" name="password2" required />
            </div>
          </div>
          <div class="row">
            <div>
              <label>나이</label>
              <input type="number" name="age" min="18" max="99" />
            </div>
            <div>
              <label>직업</label>
              <input name="job" />
            </div>
          </div>
          <div class="row">
            <div>
              <label>월 소득(만원)</label>
              <input type="number" name="monthly_income" />
            </div>
            <div>
              <label>월 지출(만원)</label>
              <input type="number" name="monthly_expense" />
            </div>
          </div>
          <div class="row">
            <div>
              <label>거주 형태</label>
              <input name="residence_type" placeholder="예: 서울 자취" />
            </div>
            <div>
              <label>저축 상태</label>
              <input name="saving_status" placeholder="예: 매달 10만원 저축" />
            </div>
          </div>
          <label>투자 경험</label>
          <select name="invest_experience">
            <option value="없음">없음</option>
            <option value="조금 있음">조금 있음</option>
            <option value="꾸준히 하는 중">꾸준히 하는 중</option>
          </select>
          <button class="btn" type="submit">회원가입 완료</button>
        </form>
        <p style="margin-top: 12px;">이미 계정이 있나요? <a href="/login/">로그인</a></p>
      </div>
    </div>
  </body>
</html>
